spring.application.name=ucopet-processor-inventory

server.port=${UCOPET_INVENTORY_PORT:8084}
server.address=${UCOPET_INVENTORY_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${UCOPET_DB_URL:jdbc:postgresql://localhost:5432/ucopetdb}
spring.datasource.username=${UCOPET_DB_USER:postgres}
spring.datasource.password=${UCOPET_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.rabbitmq.host=${UCOPET_RABBIT_HOST:localhost}
spring.rabbitmq.port=${UCOPET_RABBIT_PORT:5672}
spring.rabbitmq.username=${UCOPET_RABBIT_USER:guest}
spring.rabbitmq.password=${UCOPET_RABBIT_PASSWORD:guest}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.default-requeue-rejected=false
